name: "Build and Test"

on: [ push, workflow_dispatch, pull_request ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  higgs-shop-sample-app:
    name: "Check Higgs Shop Sample App"
    uses: ./.github/workflows/pull-request-app-checks.yml # zizmor: ignore[self-repository]
    with:
      app_relative_path: "core-sdk-samples/higgs-shop-sample-app"

  pr-notify:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    needs:
      - higgs-shop-sample-app
    name: Notify GChat
    permissions:
      contents: read
      id-token: write
    uses: ROKT/rokt-workflows/.github/workflows/oss_pr_opened_notification.yml@da0c5fd5d38e9cf113a24ec9aaea079cc7d0bc40 # zizmor: ignore[ref-version-mismatch]
    secrets:
      gchat_webhook: ${{ secrets.GCHAT_PRS_WEBHOOK }}
