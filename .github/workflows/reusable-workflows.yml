    uses: mParticle/mparticle-workflows/.github/workflows/pr-branch-check-name.yml@a78c8b34f5811be7c046a27cae900a844094f1cf # zizmor: ignore[ref-version-mismatch]
  pr-title-check:
    name: "Check PR for semantic title"
    uses: mParticle/mparticle-workflows/.github/workflows/pr-title-check.yml@a78c8b34f5811be7c046a27cae900a844094f1cf # zizmor: ignore[ref-version-mismatch]
  pr-branch-target-gitflow:
    name: "Check PR for semantic target branch"
    uses: mParticle/mparticle-workflows/.github/workflows/pr-branch-target-gitflow.yml@a78c8b34f5811be7c046a27cae900a844094f1cf # zizmor: ignore[ref-version-mismatch]
