name: "Android Sample App Checks"

on:
  workflow_call:
    inputs:
      app_relative_path:
        description: 'repo path for sample app'
        required: true
        type: string

permissions:
  contents: read

jobs:
  confirm-folder-changes:
    name: "Confirm changes in sample app folder"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Sample Apps"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

  instrumented-tests:
    name: "Instrumented Tests"
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: confirm-folder-changes
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: "Install JDK"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "zulu"
          java-version: 17
          cache: "gradle"
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: "Run Instrumented Tests"
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          working-directory: ${{ inputs.app_relative_path }}
          api-level: 29
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew connectedCheck
      - name: "Archive Instrumented Tests Results"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: "instrumented-tests-results"
          path: ./**/build/reports/androidTests/connected/**

  unit-tests:
    name: "Unit Tests"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: confirm-folder-changes
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: "Install JDK"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "zulu"
          java-version: 17
          cache: "gradle"
      - name: "Run Unit Tests"
        working-directory: ${{ inputs.app_relative_path }}
        run: ./gradlew test
      - name: "Android Unit Tests Report"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: "unit-tests-results"
          path: ./**/build/reports/**

  lint-checks:
    name: "Lint Checks"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: confirm-folder-changes
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "zulu"
          java-version: 17
          cache: "gradle"
      - name: "Run Android Core SDK Lint"
        working-directory: ${{ inputs.app_relative_path }}
        run: ./gradlew lint
      - name: "Archive Lint Test Results"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: "lint-results"
          path: ./**/build/reports/**

  kotlin-lint-checks:
    name: "Kotlin Lint Checks"
    timeout-minutes: 15
    runs-on: ubuntu-latest
    needs: confirm-folder-changes
    steps:
      - name: "Checkout Branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "zulu"
          java-version: 17
          cache: "gradle"
      - name: "Run Android Core SDK Kotlin Lint"
        working-directory: ${{ inputs.app_relative_path }}
        run: ./gradlew ktlintCheck
      - name: "Archive Lint Test Results"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: "kotlin-lint-results"
          path: ./**/build/reports/**
